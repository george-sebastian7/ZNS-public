<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Visualizer</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="layout">
        <div class="sidebar">
            <h1>Grid Maze</h1>

            <div class="control-group">
                <label>Grid Size</label>
                <div class="btn-row">
                    <button class="grid-btn active" data-size="20">20</button>
                    <button class="grid-btn" data-size="30">30</button>
                    <button class="grid-btn" data-size="40">40</button>
                </div>
            </div>

            <div class="control-group">
                <label>Speed</label>
                <div class="btn-row">
                    <button class="speed-btn active" data-speed="realtime">Real</button>
                    <button class="speed-btn" data-speed="fast">Fast</button>
                    <button class="speed-btn" data-speed="step">Step</button>
                </div>
            </div>

            <div class="control-group">
                <label>Agents</label>
                <div id="agent-checks"></div>
            </div>

            <div class="control-group">
                <div class="btn-row">
                    <button id="btn-start">Start</button>
                    <button id="btn-pause" disabled>Pause</button>
                </div>
                <div class="btn-row">
                    <button id="btn-stop" disabled>Stop</button>
                    <button id="btn-step" disabled>Step</button>
                </div>
                <button id="btn-regen" class="full-btn">Regenerate Field</button>
            </div>

            <div class="control-group">
                <label>Legend</label>
                <div class="legend">
                    <span class="legend-item"><span class="swatch wall"></span> Wall</span>
                    <span class="legend-item"><span class="swatch dropoff"></span> Drop-off</span>
                    <span class="legend-item"><span class="swatch agent"></span> Agent</span>
                    <span class="legend-item"><span class="swatch box-red"></span> Red</span>
                    <span class="legend-item"><span class="swatch box-green"></span> Green</span>
                    <span class="legend-item"><span class="swatch box-blue"></span> Blue</span>
                    <span class="legend-item"><span class="swatch box-yellow"></span> Yellow</span>
                    <span class="legend-item"><span class="swatch box-orange"></span> Orange</span>
                    <span class="legend-item"><span class="swatch box-purple"></span> Purple</span>
                </div>
            </div>

            <div id="stats" class="control-group">
                <label>Stats</label>
                <div id="stats-content"></div>
            </div>
        </div>

        <div class="canvas-area">
            <canvas id="grid-canvas"></canvas>
        </div>
    </div>

    <script src="/static/grid.js"></script>
</body>
</html>
