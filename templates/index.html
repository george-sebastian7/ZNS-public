<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <h1>AI Chat</h1>

        <div class="controls">
            <select id="provider-select">
                {% for p in providers %}
                <option value="{{ p }}">{{ p | capitalize }}</option>
                {% endfor %}
            </select>
            <select id="mode-select">
                <option value="answer">Odpoved</option>
                <option value="code">Kod</option>
            </select>
        </div>

        <div id="chat-area"></div>

        <form id="prompt-form">
            <input type="text" id="prompt-input" placeholder="Napis prompt..." autocomplete="off">
            <button type="submit" id="send-btn">Odeslat</button>
        </form>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
